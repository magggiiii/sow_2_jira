name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install tooling
        run: pip install ruff pytest pytest-cov pip-audit

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -q

      - name: Audit dependencies
        run: pip-audit || true
