# Alembic config for the SOW-to-Jira Postgres schema.
#
# The database URL is intentionally NOT set here. env.py reads it from the
# DATABASE_URL environment variable and derives a *synchronous* (psycopg2)
# driver URL for migrations. This keeps secrets out of the repo.

[alembic]
script_location = alembic
prepend_sys_path = .
# Version filenames are prefixed with a zero-padded numeric revision.
# (0001_baseline uses an explicit revision id.)

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
