# Render Blueprint for SOW-to-Jira (hosted, multi-service topology)
#
# Topology (four services + one database, all from ONE Docker image that is
# role-switched by SOW_ROLE so the build caches once):
#   - web (Docker):     FastAPI app served by Gunicorn/Uvicorn on $PORT, health at /api/status
#   - worker (Docker):  Arq background worker draining the run/push job queue
#                       (declared here so the topology is complete; the worker
#                       process itself is enabled in a later wave)
#   - keyvalue:         Redis-compatible Key Value for the Arq queue + progress store
#   - cron (Docker):    nightly garbage collection of expired runs (scripts/gc_sessions.py)
#   - databases:        Managed PostgreSQL, wired into web/worker/cron via DATABASE_URL
#
# Shared secrets live in the `sow-to-jira-shared` envVarGroup and are wired into
# every non-keyvalue service via `fromGroup`. Secrets are NEVER hardcoded here:
# APP_ENC_KEY is a sync:false secret the operator supplies in the Dashboard.
# No ARGUS_*/BIFROST_* tokens are included.
#
# Schema: https://render.com/schema/render.yaml.json

databases:
  - name: sow-to-jira-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------------------
  # Web service: the FastAPI app (Docker build from the repo Dockerfile).
  # The Dockerfile CMD binds gunicorn to 0.0.0.0:${PORT}, so Render's injected
  # $PORT is honored automatically. preDeployCommand runs DB migrations before
  # the new version takes traffic (migrations gate the deploy).
  # ---------------------------------------------------------------------------
  - type: web
    name: sow-to-jira-web
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    preDeployCommand: alembic upgrade head
    envVars:
      - key: SOW_ROLE
        value: web
      # --- Wired connections (no literal secrets) ---
      - key: DATABASE_URL
        fromDatabase:
          name: sow-to-jira-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sow-to-jira-kv
          type: keyvalue
          property: connectionString
      # --- Non-secret config defaults (safe to commit) ---
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LITELLM_PROVIDER
        value: ollama
      - key: LOG_LEVEL
        value: info
      # --- Shared secrets / cross-service config ---
      - fromGroup: sow-to-jira-shared

  # ---------------------------------------------------------------------------
  # Background worker: the Arq queue consumer that runs the pipeline off the web
  # request path. Same image, SOW_ROLE=worker. Declared for topology
  # completeness; the worker entrypoint is activated in a later wave.
  # ---------------------------------------------------------------------------
  - type: worker
    name: sow-to-jira-worker
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: SOW_ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: sow-to-jira-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: sow-to-jira-kv
          type: keyvalue
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
      - fromGroup: sow-to-jira-shared

  # ---------------------------------------------------------------------------
  # Key Value (Redis-compatible) instance for the Arq queue + progress store.
  # Internal-only access; no public ipAllowList entry. noeviction so queued
  # jobs are never dropped under memory pressure.
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: sow-to-jira-kv
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

  # ---------------------------------------------------------------------------
  # Cron job: nightly garbage collection of expired runs and their stored
  # objects. Invokes the real scripts/gc_sessions.py entrypoint. Same image,
  # SOW_ROLE=cron.
  # ---------------------------------------------------------------------------
  - type: cron
    name: sow-to-jira-gc
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    schedule: "0 3 * * *"
    dockerCommand: python -m scripts.gc_sessions
    envVars:
      - key: SOW_ROLE
        value: cron
      - key: DATABASE_URL
        fromDatabase:
          name: sow-to-jira-db
          property: connectionString
      - fromGroup: sow-to-jira-shared

# Shared env var group: operator-supplied secrets + cross-service config,
# referenced by web/worker/cron via `fromGroup`. Secrets are sync:false so they
# are entered once in the Dashboard and never committed.
envVarGroups:
  - name: sow-to-jira-shared
    envVars:
      # Application crypto key (Fernet) — was data/.keyfile. Dashboard secret.
      - key: APP_ENC_KEY
        sync: false
      # Optional second key, set ONLY during rotation (MultiFernet decrypt-only).
      - key: APP_ENC_KEY_OLD
        sync: false
      # Langfuse Cloud (LLM traces) — operator-supplied secrets.
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com

# Preview environments for pull requests (secrets like APP_ENC_KEY are excluded
# from previews and must be set per-preview by the operator).
previews:
  generation: automatic
  expireAfterDays: 3
